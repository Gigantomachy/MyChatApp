services:
  cassandra:
    image: cassandra:5
    volumes:
      - cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=MyChatApp
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  cassandra-init:
    image: cassandra:5
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/init.cql:/init.cql
    command: cqlsh cassandra -f /init.cql
    restart: "no"

  backend:
    build:
      context: ./backend/monolithic
    ports:
      - "8080:8080"
    environment:
      - CASSANDRA_HOSTS=cassandra
      - CASSANDRA_KEYSPACE=my_chat_app
      - JWT_SECRET=dev-secret-change-in-production
    depends_on:
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cassandra_data:
