apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
spec:
  # If the pod dies (node restart, Cassandra not up yet) retry a few times.
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: cassandra-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: cassandra:5
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "waiting for cassandra to accept CQL..."
              until cqlsh cassandra -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1; do
                sleep 5
              done
              echo "applying schema"
              cqlsh cassandra -f /schema/init.cql
              echo "schema applied"
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: schema
          configMap:
            # Name is rewritten by Kustomize to the hashed version.
            name: cassandra-schema