apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: cassandra-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cqlsh
          image: cassandra:5
          command: ["/bin/sh", "-c"]
          env:
            - name: CASS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: username
            - name: CASS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: password
          args:
            - |
              set -e
              echo "waiting for cassandra to accept CQL..."
              until cqlsh mychatapp-dc1-service -u "$CASS_USERNAME" -p "$CASS_PASSWORD" -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1; do
                sleep 5
              done
              echo "applying schema"
              cqlsh mychatapp-dc1-service -u "$CASS_USERNAME" -p "$CASS_PASSWORD" -f /schema/init.cql
              echo "schema applied"
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: schema
          configMap:
            name: cassandra-schema