apiVersion: v1
kind: Service
metadata:
  name: cassandra
  labels:
    app: cassandra
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: cassandra
  ports:
    - name: cql
      port: 9042
      targetPort: 9042
    - name: intra-node
      port: 7000
      targetPort: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      terminationGracePeriodSeconds: 120  # Cassandra needs time to flush memtables and stop gossiping cleanly
      containers:
        - name: cassandra
          image: cassandra:5
          ports:
            - name: cql
              containerPort: 9042
            - name: intra-node
              containerPort: 7000
          env:
            - name: CASSANDRA_CLUSTER_NAME
              value: MyChatApp
            - name: MAX_HEAP_SIZE
              value: 1G
            - name: HEAP_NEWSIZE
              value: 200M
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              memory: 3Gi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30   # 30 x 10s = 5 minutes of grace since cold start on gp3 is slow
          livenessProbe:
            tcpSocket:
              port: 7000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "nodetool drain || true"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/cassandra
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi