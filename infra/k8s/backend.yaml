apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: backend
      initContainers:
        - name: wait-for-schema
          image: cassandra:5
          command: ["/bin/sh", "-c"]
          env:
            - name: CASS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: username
            - name: CASS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: password
          args:
            - |
              until cqlsh mychatapp-dc1-service -u "$CASS_USERNAME" -p "$CASS_PASSWORD" -e "DESCRIBE KEYSPACE my_chat_app" > /dev/null 2>&1; do
                echo "waiting for keyspace my_chat_app"
                sleep 5
              done
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
      containers:
        - name: backend
          image: backend      # placeholder - Kustomize rewrites this to the ECR URI + tag.
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: CASSANDRA_HOSTS
              value: mychatapp-dc1-service   # operator-created client service (verify: kubectl get svc)
            - name: CASSANDRA_KEYSPACE
              value: my_chat_app
            - name: CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mychatapp-superuser
                  key: password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: REDIS_ADDR
              value: redis:6379
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi