apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: mychatapp
spec:
  cassandra:
    serverVersion: "5.0.9"              # pin current 5.0 patch at apply time
    datacenters:
      - metadata:
          name: dc1                     # must match NTS options in init.cql
        size: 3
        racks:                          # operator sets snitch rack + required nodeAffinity per rack
          - name: rack-a
            nodeAffinityLabels: { topology.kubernetes.io/zone: ca-central-1a }
          - name: rack-b
            nodeAffinityLabels: { topology.kubernetes.io/zone: ca-central-1b }
          - name: rack-c
            nodeAffinityLabels: { topology.kubernetes.io/zone: ca-central-1d }
        storageConfig:
          cassandraDataVolumeClaimSpec:
            storageClassName: gp3       # existing StorageClass, unchanged
            accessModes: ["ReadWriteOnce"]
            resources: { requests: { storage: 10Gi } }
        config:
          jvmOptions:
            heapSize: 1Gi               # replaces MAX_HEAP_SIZE/HEAP_NEWSIZE
        resources:                      # mirror today's requests/limits; verify exact CRD field placement at apply time
          requests: { cpu: 500m, memory: 2Gi }
          limits: { memory: 3Gi }
  reaper:
    autoScheduling:
      enabled: true                     # operator-managed repair schedules for all keyspaces