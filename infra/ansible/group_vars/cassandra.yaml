---
cassandra_version: "5.0.9"
cassandra_sha256: "eee1460b47ebe188a29521207230617f22aad7f9e1674f5ea454f10c8f344d61"
cluster_name: "MyChatApp"
dc_name: "dc1"
heap_mb: "1024"

# windows path exposed into WSL, generated by ../db.sh - the single source of truth for app + ops creds
secrets_dir: "/mnt/c/dev/projects/MyChatApp/infra/k8s/secrets"

seeds: "{{ groups['cassandra'] | map('extract', hostvars, 'private_ip_address') | join(',') }}"
ansible_ssh_private_key_file: "~/.ssh/mychatapp.pem" 
ansible_user: ec2-user          # was in ansible.cfg - we have to place this here because of WSL2 (world writable /mnt/c)
ansible_become: true
ansible_become_method: sudo

ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" # also necessary because of wsl2 ignoring ansible config