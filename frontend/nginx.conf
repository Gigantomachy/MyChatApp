map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml text/javascript;
    gzip_min_length 1024;

    # Docker DNS resolver — re-resolves backend at request time
    # for K8s, use the cluster DNS (e.g., kube-dns.kube-system.svc.cluster.local)
    resolver 127.0.0.11 valid=30s;

    # never cache index.html because it references hashed bundles
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # hashed build assets ( Vite emits these under /assets/ ) — cache for a long time
    location ^~ /assets/ {
        expires 24h;
        add_header Cache-Control "public, immutable";
    }

    # unhashed top-level static files ( favicon, og-image, etc. ) should have a short TTL
    location ~* \.(ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — variable in proxy_pass forces dynamic DNS resolution
    location /api/ {
        set $backend "backend";
        proxy_pass http://$backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket — only upgrades when client requests it
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
