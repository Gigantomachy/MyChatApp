name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      cassandra:
        image: cassandra:5
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/monolithic/go.mod
          cache-dependency-path: backend/monolithic/go.sum

      - name: gofmt check
        working-directory: backend/monolithic
        run: test -z "$(gofmt -l .)"

      - name: go vet
        working-directory: backend/monolithic
        run: go vet ./...

      - name: go test
        working-directory: backend/monolithic
        run: go test ./... -count=1

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      cassandra:
        image: cassandra:5
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'DESCRIBE KEYSPACES'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
          --health-start-period 40s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/monolithic/go.mod
          cache-dependency-path: backend/monolithic/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Create test keyspace
        working-directory: frontend
        run: |
          node -e "const c=require('cassandra-driver');const q=\"CREATE KEYSPACE IF NOT EXISTS my_chat_app_test WITH replication = {'class':'SimpleStrategy','replication_factor':1}\";(async()=>{const cl=new c.Client({contactPoints:['127.0.0.1']});await cl.connect();await cl.execute(q);await cl.shutdown();console.log('keyspace ready')})().catch(e=>{console.error(e);process.exit(1)})"

      - name: Build backend binary
        working-directory: backend/monolithic
        run: go build -o /tmp/mychatapp-server ./cmd/monolithic

      - name: Start backend
        working-directory: backend/monolithic
        env:
          CASSANDRA_KEYSPACE: my_chat_app_test
          JWT_SECRET: ci-only-secret-not-for-production-0123456789abcdef
        run: |
          /tmp/mychatapp-server &
          echo $! > /tmp/mychatapp-server.pid
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/me || true)
            if [ "$code" = "401" ]; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend failed to become ready" >&2
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7